<div class="container mt-3">
    <div class="row">

        <div class="col-12 text-right mb-4">
            <button routerLink="AddProduct" class="btn btn-primary">Add Products</button>
        </div>
        <div class="col-md-4 mb-4">
            <ul class="list-group">
                <li routerLinkActive="active" [routerLink]="product.id" class="list-group-item"
                    *ngFor="let product of ProductArr">
                    {{product.pname}}
                    <small class="badge" [ngClass]="{
               'badge-primary':product.pstatus==='Available',
            'badge-warning':product.pstatus==='Out of Stock'
        }">{{product.pstatus}}</small>
                </li>
            </ul>
        </div>
        <div class="col-md-8">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
