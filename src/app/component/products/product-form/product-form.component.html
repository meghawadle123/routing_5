<div class="card">
    <div class="card-body">
        <h2>{{isInEditMode?'Update Product':'Add product'}}</h2>
        <form [formGroup]="productForm" (ngSubmit)="onAddProduct()">
            <div class="form-group">
                <label for="pname">Product Name*</label>
                <input formControlName="pname" type="text" class="form-control">
            </div>
            <div class="form-group">
                <label for="imageUrl">Image Url*</label>
                <input formControlName="imageUrl" type="text" class="form-control">
            </div>
             <div class="form-group">
                <label for="price">Price*</label>
                <input formControlName="price" type="text" class="form-control">
            </div>
            <div class="form-group">

                <label for="category">category*</label>
                <input formControlName="category" type="text" class="form-control">
            </div>

            <div class="form-group">
                <label for="pstatus">Product status*</label>
                <select formControlName="pstatus" type="text" class="form-control">

                    <option value="Available">Available</option>
                    <option value="Out of Stock">Out of Stock</option>

                </select>
            </div>

            <button
            *ngIf="!isInEditMode"
            class="btn btn-primary">Add Product</button>
            <button
            (click)="Onupdate()"
            *ngIf="isInEditMode"
             class="btn btn-primary" type="button">Update Product</button>

        </form>
    </div>
</div>
